<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin conexión - Dbus Donostia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { text-align: center; max-width: 320px; }
    .icon { width: 80px; height: 80px; margin: 0 auto 24px; color: #94a3b8; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    p { color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    .badge { display: inline-block; padding: 8px 16px; background: #fef3c7; color: #92400e; border-radius: 9999px; font-size: 0.875rem; margin-bottom: 24px; }
    button { background: #0066cc; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; min-height: 48px; width: 100%; }
    button:hover { background: #0052a3; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      p { color: #94a3b8; }
      .badge { background: #78350f; color: #fde68a; }
      button { background: #0066cc; }
      button:hover { background: #0052a3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. La app mostrará los datos guardados en caché.</p>
    <div class="badge">Datos de hace 15 min</div>
    <button onclick="window.location.reload()">Reintentar conexión</button>
  </div>
</body>
</html>
