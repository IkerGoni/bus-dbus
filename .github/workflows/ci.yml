name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dbus/contracts --filter @dbus/core run build
      - run: pnpm --filter @dbus/contracts --filter @dbus/core run test
      - run: pnpm --filter @dbus/bot run test tests/alerts.test.ts tests/nearby-index.test.ts tests/telegram-launch.test.ts tests/unit.test.ts tests/validate-line.test.ts tests/haversine-parity.test.ts -- --reporter=verbose

  test-integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dbus/contracts --filter @dbus/core run build
      - id: integration
        run: pnpm --filter @dbus/bot run test tests/integration.test.ts tests/handlers.test.ts -- --testTimeout=30000 --reporter=verbose
        # Hits the external Dbus live API; allowed to fail gracefully without blocking CI while reporting a warning below.
        continue-on-error: true
      - name: Report integration result
        if: steps.integration.outcome == 'failure'
        run: |
          echo "::warning title=Integration tests failed::External Dbus live API may be unreachable/timed out, or an integration/handler regression occurred. Inspect the integration step logs."
          echo '⚠️ Tests de integración fallaron (API Dbus no disponible, timeout o regresión en integración/handlers).'
          echo 'Revisar los logs del paso integration para confirmar si es indisponibilidad externa o una regresión.'

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ci
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/contracts/dist
            packages/core/dist
            apps/bot/dist
          retention-days: 7
