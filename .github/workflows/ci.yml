name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Identidad pública (correos y rutas locales)
        run: node tools/repo/check-identity.mjs

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dbus/contracts --filter @dbus/core run build
      - run: pnpm --filter @dbus/contracts --filter @dbus/core run test
      # `exec` pasa las opciones a vitest; con `run test … -- --x` pnpm deja el `--` y vitest las ignora.
      - run: pnpm --filter @dbus/bot exec vitest run tests/alerts.test.ts tests/nearby-index.test.ts tests/telegram-launch.test.ts tests/unit.test.ts tests/validate-line.test.ts tests/haversine-parity.test.ts --reporter=verbose
        env:
          BOT_TOKEN: vitest_test_token
          DB_DRIVER: memory

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ci
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/contracts/dist
            packages/core/dist
            apps/bot/dist
          retention-days: 7
